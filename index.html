<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MicroFoundry: tiny tools for everyday tasks</title>
<meta name="description" content="Free, simple tools for your phone: a tally counter, pulse counter, timer, quick notes, timestamps, text cleaner, draft writer and a random choice picker.">
<meta name="theme-color" content="#eef0f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap">
<link rel="stylesheet" href="assets/mf.css">
<script src="assets/mf.js"></script>
<style>
  .hero { margin: 8px 0 26px; }
  .hero h1 {
    font-stretch: 125%;
    font-weight: 800;
    font-size: 44px;
    line-height: 1;
    letter-spacing: -0.015em;
    margin: 0 0 12px;
  }
  .hero p { color: var(--muted); margin: 0; max-width: 30em; }

  .tools { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .tool {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 76px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-plate);
    color: var(--ink);
    text-decoration: none;
  }
  .tool:active { transform: scale(0.99); }
  .tool b {
    display: block;
    font-stretch: 125%;
    font-weight: 800;
    font-size: 21px;
    line-height: 1.1;
    margin-bottom: 3px;
  }
  .tool span { color: var(--muted); font-size: 15px; line-height: 1.35; }
  .tool .go {
    margin-left: auto;
    flex: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--accent-soft);
    display: grid; place-items: center;
  }
  .tool .go svg { width: 16px; height: 16px; stroke: var(--accent); }

  .install { margin-top: 22px; }
  .install p { margin: 0 0 12px; }
</style>
</head>
<body>
<main class="mf-page">
  <header class="mf-top">
    <a href="index.html" aria-label="MicroFoundry home"><img class="mf-logo" src="assets/logo.png" alt="MicroFoundry" style="height:30px"></a>
  </header>

  <section class="hero">
    <h1>Tiny tools. Solve it fast.</h1>
    <p>Each tool does one small job well, right on your phone. Free to try, nothing to sign up for.</p>
  </section>

  <ul class="tools" id="tools"></ul>

  <div class="mf-plate install" id="install">
    <div class="mf-label">Keep MicroFoundry on your home screen</div>
    <p class="mf-note" id="installHow">Add it to your home screen to open every tool with one tap, even without internet.</p>
    <button class="mf-btn mf-btn--go" id="installBtn" hidden>Add to home screen</button>
  </div>

  <footer class="mf-foot">
    <span>MicroFoundry</span>
    <a href="Pricing/index.html">Pricing</a>
  </footer>
</main>

<script>
const arrow = '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>';

document.getElementById("tools").innerHTML = Object.entries(MF.TOOLS).map(([name, t]) =>
  `<li><a class="tool" href="${name}/index.html"><div><b>${name}</b><span>${t.what}</span></div><i class="go">${arrow}</i></a></li>`
).join("");


// Home-screen install: Android shows a button; iPhone gets instructions.
const how = document.getElementById("installHow");
const btn = document.getElementById("installBtn");
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

if (standalone) {
  document.getElementById("install").hidden = true;
} else if (isIOS) {
  how.textContent = "On iPhone: open this page in Safari, tap the Share button, then tap \"Add to Home Screen\".";
}

let deferred;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferred = e;
  btn.hidden = false;
});
btn.addEventListener("click", async () => {
  if (!deferred) return;
  deferred.prompt();
  await deferred.userChoice;
  deferred = null;
  btn.hidden = true;
});
</script>
</body>
</html>
