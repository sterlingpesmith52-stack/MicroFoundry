<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MicroFoundry Starter Widget</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 16px;
            background: white;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .logo-box {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-box img {
            height: 28px;
            width: auto;
        }

        h1 {
            font-size: 22px;
            margin: 0;
            padding: 0;
            text-align: left;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        button {
            padding: 8px 14px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            text-align: left;
            width: auto;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo-box">
            <img src="IMG_1741.jpeg" alt="MicroFoundry Logo" />
        </div>
        <h1>Starter Widget</h1>
    </div>

    <div class="controls">
        <button onclick="runWidget()">Run</button>
        <button onclick="clearText()">Clear</button>
    </div>

    <textarea id="input" placeholder="Paste text here..."></textarea>

    <script>
        function runWidget() {
            const box = document.getElementById("input");
            box.value = "Starter Widget executed.";
        }

        function clearText() {
            document.getElementById("input").value = "";
        }
    </script>

</body>
</html>
